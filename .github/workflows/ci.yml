name: Winshell CI & Release

on:
  push:
    # 1. main 브랜치에 push될 때 빌드/테스트 검증
    branches: [ "main" ]
    # 2. v1.0.0 같은 버전 태그(tag)를 푸시하면 릴리즈 단계까지 실행
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

# GitHub Releases에 파일을 업로드하기 위한 쓰기(Write) 권한 부여
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Project
        run: |
          nmake

      - name: Run Tests
        run: |
          nmake test

      - name: Compress Binaries to Zip
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          Compress-Archive -Path bin\* -DestinationPath winshell-windows-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # 압축한 zip 파일을 릴리즈 자산으로 첨부
          files: winshell-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
